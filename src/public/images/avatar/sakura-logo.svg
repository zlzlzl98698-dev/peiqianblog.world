<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EBE"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFD6E7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="46" fill="#FFF8FA" stroke="#FFD6E7" stroke-width="3"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FF6B9D" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.6"/>

  <!-- 5 Sakura Petals -->
  <g transform="translate(50,50)" filter="url(#softGlow)">
    <!-- Petal 1 (Top) -->
    <path d="M 0,-8 C -12,-22 -14,-36 0,-44 C 14,-36 12,-22 0,-8 Z" fill="url(#sakuraGrad)"/>
    <path d="M -4,-38 Q 0,-33 4,-38" stroke="#FFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Petal 2 (Top Right) -->
    <path d="M 0,-8 C -12,-22 -14,-36 0,-44 C 14,-36 12,-22 0,-8 Z" fill="url(#sakuraGrad)" transform="rotate(72)"/>
    <path d="M -4,-38 Q 0,-33 4,-38" stroke="#FFF" stroke-width="1.5" fill="none" stroke-linecap="round" transform="rotate(72)"/>

    <!-- Petal 3 (Bottom Right) -->
    <path d="M 0,-8 C -12,-22 -14,-36 0,-44 C 14,-36 12,-22 0,-8 Z" fill="url(#sakuraGrad)" transform="rotate(144)"/>
    
    <!-- Petal 4 (Bottom Left) -->
    <path d="M 0,-8 C -12,-22 -14,-36 0,-44 C 14,-36 12,-22 0,-8 Z" fill="url(#sakuraGrad)" transform="rotate(216)"/>
    
    <!-- Petal 5 (Top Left) -->
    <path d="M 0,-8 C -12,-22 -14,-36 0,-44 C 14,-36 12,-22 0,-8 Z" fill="url(#sakuraGrad)" transform="rotate(288)"/>

    <!-- Flower Center Stamen -->
    <circle cx="0" cy="0" r="10" fill="url(#centerGrad)" stroke="#FF6B9D" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#FF6B9D"/>
    
    <!-- Small Cyber Dot / Circuit Accent -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#FF6B9D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="11" y2="-4" stroke="#FF6B9D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7" y2="10" stroke="#FF6B9D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7" y2="10" stroke="#FF6B9D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-11" y2="-4" stroke="#FF6B9D" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
